[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radar_signal_processing"
version = "0.1.0"
description = "Signals and systems through FMCW radar: a simulator and DSP code for the Electrons to Vision series."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebooks = ["jupyterlab>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/radar_signal_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
